- generate_guids_in_csvs:
    source:
    - src/data/Basic.csv
    columns:
    - guid
- build_parts:
  - note_models_from_yaml_part:
      part_id: Basic
      file: src/note_models/Basic/Basic.yaml
  - headers_from_yaml_part:
      part_id: deck_headers
      file: src/headers/header1.yaml
  - notes_from_csvs:
      part_id: deck_notes
      save_to_file: null
      file_mappings:
      - file: src/data/Basic.csv
        note_model: Basic
      note_model_mappings:
      - note_models:
        - Basic
  - media_group_from_folder:
      part_id: deck_media
      source: src/media/
      recursive: true
- generate_crowd_anki:
    folder: build/all_lang_notes_anki
    notes:
      part_id: deck_notes
    note_models:
      parts:
      - part_id: Basic
    headers: deck_headers
    media:
      parts:
      - deck_media
